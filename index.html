<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇫🇷 French Fun Helper 🎉</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#FF6B8B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
   <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
    body { background: linear-gradient(to bottom right, #ffccd5, #b5e6ff); padding: 10px; padding-bottom: 80px; min-height: 100vh; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; }

    /* Header */
    .header { background: white; border-radius: 20px; padding: 12px; margin-bottom: 10px; border: 4px solid #ff9e6d; }
    h1 { color: #ff6b8b; font-size: 1.5rem; }

    /* STATUS BAR */
    .status-bar { background: white; padding: 8px 15px; border-radius: 50px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 3px solid #118AB2; }
    .status-info { font-weight: 800; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }
    
    .magic-mini-btn { background: #118AB2; color: white; border: none; padding: 8px 15px; border-radius: 50px; font-weight: 900; cursor: pointer; }

    /* PRESET BUTTONS */
    .section-title { font-weight: 900; color: #5a67d8; margin: 15px 0 5px; text-align: left; font-size: 1.1rem; }
    .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .preset-card-btn { background: white; border: 3px solid #ff9e6d; border-radius: 15px; padding: 20px 10px; font-size: 1rem; font-weight: 900; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #ff9e6d; }
    .preset-card-btn:active { transform: translateY(4px); box-shadow: 0 0 0; }

    /* PRACTICE LIST */
    .phrase-card { background: white; border-radius: 18px; padding: 20px; margin: 15px 0; border: 4px solid #a3e4d7; text-align: left; }
    .french-text { font-size: 1.8rem; font-weight: 900; color: #2d3748; display: block; margin-bottom: 5px; }
    .english-text { font-size: 1.2rem; color: #4a5568; font-weight: 700; margin-bottom: 15px; min-height: 1.5rem; }
    
    .mystery-active .english-text { background: #edf2f7; color: #edf2f7 !important; border-radius: 8px; position: relative; }
    .mystery-active .english-text::after { content: "❓ Tap to Reveal"; position: absolute; left: 10px; color: #5a67d8; font-size: 1rem; }
    .revealed .english-text { background: transparent !important; color: #06D6A0 !important; }
    .revealed .english-text::after { display: none !important; }

    .card-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card-btn { border: none; border-radius: 12px; padding: 15px; font-weight: 800; color: white; cursor: pointer; font-size: 1rem; }
    .spk-fr { background: #4cd964; }
    .spk-en { background: #ff9e6d; }

    /* BOTTOM SHEETS / DRAWERS */
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 4px solid #5a67d8; display: flex; z-index: 100; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
    .bar-item { flex: 1; padding: 15px; font-weight: 900; cursor: pointer; border-right: 1px solid #eee; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .bar-item:last-child { border-right: none; }
    .bar-homework { color: #9d4edd; }
    .bar-game { color: #ff6b8b; }

    /* HOMEWORK DRAWER */
    #homeworkDrawer { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 200; padding: 20px; }
    .drawer-content { background: white; border-radius: 25px; padding: 20px; height: 90vh; overflow-y: auto; text-align: center; }
    textarea { width: 100%; height: 250px; font-size: 1.2rem; padding: 15px; border-radius: 15px; border: 3px solid #9d4edd; background: #fdf2ff; margin: 10px 0; outline: none; }
    
    .hw-btn-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .hw-btn { padding: 12px; border: none; border-radius: 12px; font-weight: 900; color: white; cursor: pointer; }

    /* HANGMAN GAME */
    #gameDrawer { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 200; padding: 20px; }
    .hangman-area { font-size: 2rem; letter-spacing: 10px; margin: 20px 0; font-weight: 900; color: #2d3748; }
    .keyboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
    .key { width: 35px; height: 40px; background: #eee; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border: 1px solid #ccc; }
    .key.used { opacity: 0.3; pointer-events: none; }
    .hangman-msg { font-weight: 900; margin: 10px 0; font-size: 1.2rem; }

    /* Backpack Modal */
    #backpackModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 300; padding: 20px; }
    .history-item { padding: 15px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
   </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🇫🇷 French Fun 🎉</h1>
        </div>

        <div id="statusBar" class="status-bar">
            <div class="status-info">
                <span id="statusIcon">🌐</span>
                <span id="stCountText">Ready!</span>
            </div>
            <button class="magic-mini-btn" id="magicBtn" onclick="translateAllPhrases()">✨ Magic</button>
        </div>

        <button id="mysteryToggle" class="game-button" onclick="toggleMysteryMode()">🕵️‍♀️ Start Mystery Game</button>

        <div class="section-title">🎈 Pick a Fun Set:</div>
        <div class="preset-grid">
            <button class="preset-card-btn" onclick="loadPreset('greetings')">👋 Greetings</button>
            <button class="preset-card-btn" onclick="loadPreset('numbers')">🔢 Numbers</button>
            <button class="preset-card-btn" onclick="loadPreset('colors')">🎨 Colors</button>
            <button class="preset-btn-card preset-card-btn" onclick="loadPreset('animals')">🐶 Animals</button>
            <button class="preset-card-btn" onclick="loadPreset('family')">👨‍👩‍👧 Family</button>
            <button class="preset-card-btn" onclick="loadPreset('body')">👃 Body Parts</button>
            <button class="preset-card-btn" onclick="loadPreset('hobbies')">⚽ Hobbies</button>
            <button class="preset-card-btn" onclick="loadPreset('weather')">☀️ Weather</button>
        </div>

        <div id="phrasesList"></div>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
        <div class="bar-item bar-homework" onclick="toggleHomework()">
            <span>📝</span> School Homework
        </div>
        <div class="bar-item bar-game" onclick="toggleGame()">
            <span>🎮</span> Play Hangman
        </div>
    </div>

    <!-- HOMEWORK DRAWER -->
    <div id="homeworkDrawer">
        <div class="drawer-content">
            <h2 style="color:#9d4edd">✏️ My School Words</h2>
            <p>Type your assignment phrases here:</p>
            <textarea id="homeworkInput" placeholder="Bonjour&#10;Merci&#10;..."></textarea>
            
            <div class="hw-btn-row">
                <button class="hw-btn" style="background:#4cd964" onclick="saveHomework()">💾 Save</button>
                <button class="hw-btn" style="background:#9d4edd" onclick="toggleBackpack()">🎒 Backpack</button>
                <button class="hw-btn" style="background:#ff4d4d" onclick="clearHomework()">🧹 Clear</button>
            </div>
            
            <button onclick="toggleHomework()" style="margin-top:20px; background:#2d3748; color:white; padding:15px; width:100%; border-radius:15px; border:none; font-weight:900">Close homework</button>
        </div>
    </div>

    <!-- HANGMAN DRAWER -->
    <div id="gameDrawer">
        <div class="drawer-content">
            <h2 style="color:#ff6b8b">🥨 Le Pendu (Hangman)</h2>
            <p id="clueText" style="color:#666; font-style:italic; margin-top:5px;">Clue: ???</p>
            <div id="hangmanDisplay" class="hangman-area">_ _ _ _</div>
            <div id="gameMessage" class="hangman-msg">Guess a letter!</div>
            <div id="keyboard" class="keyboard"></div>
            <button onclick="startHangman()" style="margin-top:20px; background:#4cd964; color:white; padding:12px; width:100%; border-radius:15px; border:none; font-weight:900">New Game</button>
            <button onclick="toggleGame()" style="margin-top:10px; background:#2d3748; color:white; padding:12px; width:100%; border-radius:15px; border:none; font-weight:900">Exit Game</button>
        </div>
    </div>

    <!-- BACKPACK MODAL (Nested logic) -->
    <div id="backpackModal">
        <div class="modal-content">
            <h2 style="color:#9d4edd">🎒 Past Weeks</h2>
            <div id="historyList"></div>
            <button onclick="toggleBackpack()" style="margin-top:20px; background:#2d3748; color:white; padding:15px; width:100%; border-radius:15px; border:none; font-weight:bold">Back</button>
        </div>
    </div>

    <script>
        // DATA & STATE
        let cache = JSON.parse(localStorage.getItem('phraseTranslations') || '{}');
        let history = JSON.parse(localStorage.getItem('frenchHistory') || '{}');
        let currentHomework = localStorage.getItem('homeworkPhrases') || '';
        let currentPracticeList = [];
        let isMysteryMode = false;
        let speech = window.speechSynthesis;

        const presets = {
            greetings: ["Bonjour", "Salut", "Comment ça va ?", "Ça va bien", "Merci", "De rien", "Au revoir"],
            numbers: ["Un", "Deux", "Trois", "Quatre", "Cinq", "Six", "Sept", "Huit", "Neuf", "Dix"],
            colors: ["Rouge", "Bleu", "Vert", "Jaune", "Orange", "Rose", "Violet", "Noir", "Blanc"],
            animals: ["Un chien", "Un chat", "Un lapin", "Un oiseau", "Un poisson", "Un cheval"],
            family: ["Ma maman", "Mon papa", "Ma sœur", "Mon frère", "Ma grand-mère", "Mon grand-père"],
            body: ["La tête", "Le nez", "La bouche", "Les yeux", "Les oreilles", "Les mains"],
            hobbies: ["Le foot", "La danse", "Le dessin", "La musique", "La lecture"],
            weather: ["Il fait beau", "Il pleut", "Il neige", "Il fait chaud", "Il fait froid"]
        };

        const secretWords = [
            {w: "POMME", c: "An apple"}, {w: "CHAT", c: "Meow!"}, {w: "BICYCLETTE", c: "Two wheels"},
            {w: "SOLEIL", c: "Yellow and hot"}, {w: "ECOLE", c: "Where we learn"}, {w: "AMI", c: "A friend"}
        ];

        // INITIALIZE
        window.onload = () => {
            document.getElementById('homeworkInput').value = currentHomework;
            // Default show greetings
            loadPracticeList(presets.greetings);
            speech.getVoices();
        };

        // UI HELPERS
        function norm(t) { return t.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
        function getTr(t) { return cache[norm(t)] || null; }

        function toggleHomework() {
            const d = document.getElementById('homeworkDrawer');
            d.style.display = d.style.display === 'block' ? 'none' : 'block';
            if (d.style.display === 'block') {
                loadPracticeList(document.getElementById('homeworkInput').value.split('\n').filter(l => l.trim()));
            }
        }

        function loadPreset(key) {
            loadPracticeList(presets[key]);
        }

        function loadPracticeList(list) {
            currentPracticeList = list.filter(l => l.trim().length > 0);
            renderList();
        }

        function renderList() {
            const lst = document.getElementById('phrasesList');
            lst.innerHTML = '';
            document.getElementById('stCountText').textContent = `${currentPracticeList.length} phrases`;

            currentPracticeList.forEach((p, i) => {
                const tr = getTr(p);
                const card = document.createElement('div');
                card.className = 'phrase-card' + (isMysteryMode ? '' : ' revealed');
                
                const fText = document.createElement('span'); fText.className = 'french-text'; fText.textContent = p;
                const eText = document.createElement('span'); eText.className = 'english-text'; eText.textContent = tr || '...';
                
                const bDiv = document.createElement('div'); bDiv.className = 'card-btns';
                const sBtn = document.createElement('button'); sBtn.className = 'card-btn spk-fr'; sBtn.textContent = '🎤 French';
                sBtn.onclick = () => spk(p, 'fr-FR');
                
                const tBtn = document.createElement('button'); tBtn.className = 'card-btn spk-en'; 
                tBtn.textContent = isMysteryMode ? '🎯 Reveal' : (tr ? '🎯 English' : '🌐 Get Translation');
                
                tBtn.onclick = async () => {
                    card.classList.add('revealed');
                    let trans = getTr(p);
                    if (!trans && navigator.onLine) {
                        eText.textContent = '⏳...';
                        trans = await translateSingle(p);
                        if (trans) { eText.textContent = trans; tBtn.textContent = '🎯 English'; }
                    }
                    if (trans) spk(trans, 'en-US');
                };

                card.append(fText, eText, bDiv); bDiv.append(sBtn, tBtn); lst.appendChild(card);
            });
        }

        // HOMEWORK LOGIC
        function saveHomework() {
            const val = document.getElementById('homeworkInput').value;
            localStorage.setItem('homeworkPhrases', val);
            const name = prompt("Name this Week:", "Week " + (Object.keys(history).length + 1));
            if (name) {
                history[name] = val;
                localStorage.setItem('frenchHistory', JSON.stringify(history));
                alert("Homework Saved to Backpack! 🎒");
            }
            loadPracticeList(val.split('\n'));
        }

        function clearHomework() {
            if (confirm("Clear your school list?")) {
                document.getElementById('homeworkInput').value = '';
                localStorage.setItem('homeworkPhrases', '');
                loadPracticeList([]);
            }
        }

        // TRANSLATION
        async function translateSingle(p) {
            try {
                const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(p)}&langpair=fr|en`);
                const d = await r.json();
                const tr = d.responseData.translatedText;
                cache[norm(p)] = tr;
                localStorage.setItem('phraseTranslations', JSON.stringify(cache));
                return tr;
            } catch (e) { return null; }
        }

        async function translateAllPhrases() {
            const magicBtn = document.getElementById('magicBtn');
            magicBtn.disabled = true;
            for (let i = 0; i < currentPracticeList.length; i++) {
                magicBtn.textContent = `${i+1}/${currentPracticeList.length}`;
                if (!getTr(currentPracticeList[i])) {
                    await translateSingle(currentPracticeList[i]);
                }
            }
            magicBtn.textContent = "✨ Magic";
            magicBtn.disabled = false;
            renderList();
        }

        function spk(t, lang) {
            speech.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = lang; u.rate = 0.8;
            if (lang === 'fr-FR') {
                const fv = speech.getVoices().find(v => v.lang.startsWith('fr'));
                if (fv) u.voice = fv;
            }
            speech.speak(u);
        }

        // HANGMAN LOGIC
        let hw, targetWord, targetClue, guessed, mistakes;
        function toggleGame() {
            const d = document.getElementById('gameDrawer');
            d.style.display = d.style.display === 'block' ? 'none' : 'block';
            if (d.style.display === 'block') startHangman();
        }

        function startHangman() {
            // Pick from homework if possible
            const hwWords = document.getElementById('homeworkInput').value.split('\n').filter(w => w.trim().length > 2 && !w.includes(' '));
            if (hwWords.length > 0) {
                const pick = hwWords[Math.floor(Math.random() * hwWords.length)].toUpperCase();
                targetWord = pick;
                targetClue = getTr(pick) || "From your homework!";
            } else {
                const pick = secretWords[Math.floor(Math.random() * secretWords.length)];
                targetWord = pick.w;
                targetClue = pick.c;
            }
            
            guessed = [];
            mistakes = 0;
            document.getElementById('clueText').textContent = "Clue: " + targetClue;
            document.getElementById('gameMessage').textContent = "Can you guess the French word?";
            document.getElementById('gameMessage').style.color = "#2d3748";
            renderHangman();
            renderKeyboard();
        }

        function renderHangman() {
            let display = "";
            for (let char of targetWord) {
                if (guessed.includes(char)) display += char + " ";
                else display += "_ ";
            }
            document.getElementById('hangmanDisplay').textContent = display;
            
            if (!display.includes("_")) {
                document.getElementById('gameMessage').textContent = "FELICITATIONS! 🏆 You won!";
                document.getElementById('gameMessage').style.color = "#4cd964";
            }
            if (mistakes >= 6) {
                document.getElementById('gameMessage').textContent = "Game Over! It was: " + targetWord;
                document.getElementById('gameMessage').style.color = "#ff4d4d";
            }
        }

        function renderKeyboard() {
            const kb = document.getElementById('keyboard');
            kb.innerHTML = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(letter => {
                const key = document.createElement('div');
                key.className = 'key';
                key.textContent = letter;
                key.onclick = () => {
                    if (guessed.includes(letter) || mistakes >= 6) return;
                    guessed.push(letter);
                    if (!targetWord.includes(letter)) mistakes++;
                    key.classList.add('used');
                    renderHangman();
                };
                kb.appendChild(key);
            });
        }

        // BACKPACK
        function toggleBackpack() {
            const modal = document.getElementById('backpackModal');
            const hList = document.getElementById('historyList'); hList.innerHTML = '';
            Object.keys(history).reverse().forEach(name => {
                const div = document.createElement('div'); div.className = 'history-item';
                div.innerHTML = `<span><b>${name}</b></span> <div>
                    <button style="padding:10px; border-radius:10px; border:2px solid #0369a1; background:white; font-weight:bold" onclick="loadHist('${name}')">📖 Load</button>
                    <button style="padding:10px; border-radius:10px; border:2px solid #be123c; background:white; margin-left:10px;" onclick="delHist('${name}')">🗑️</button>
                </div>`;
                hList.appendChild(div);
            });
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function loadHist(n) {
            document.getElementById('homeworkInput').value = history[n];
            loadPracticeList(history[n].split('\n'));
            toggleBackpack();
        }

        function delHist(n) {
            if (confirm("Delete this week?")) {
                delete history[n];
                localStorage.setItem('frenchHistory', JSON.stringify(history));
                toggleBackpack();
            }
        }

        function toggleMysteryMode() {
            isMysteryMode = !isMysteryMode;
            document.body.classList.toggle('mystery-active', isMysteryMode);
            document.getElementById('mysteryToggle').classList.toggle('active', isMysteryMode);
            renderList();
        }

        function shareApp() { navigator.share ? navigator.share({ title: 'French Fun', url: window.location.href }) : alert(window.location.href); }
    </script>
</body>
</html>
