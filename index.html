<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇫🇷 French Fun V3.7 🎉</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#FF6B8B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
   <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
    body { background: linear-gradient(to bottom right, #ffccd5, #b5e6ff); padding: 10px; padding-bottom: 100px; min-height: 100vh; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; }

    .header { background: white; border-radius: 20px; padding: 12px; margin-bottom: 10px; border: 4px solid #ff9e6d; }
    h1 { color: #ff6b8b; font-size: 1.5rem; }

    .status-bar { background: white; padding: 8px 15px; border-radius: 50px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 3px solid #118AB2; }
    .status-info { font-weight: 800; font-size: 0.85rem; color: #2d3748; }
    .magic-mini-btn { background: #118AB2; color: white; border: none; padding: 8px 15px; border-radius: 50px; font-weight: 900; cursor: pointer; }

    .phrase-card { background: white; border-radius: 25px; padding: 20px; margin: 15px 0; border: 5px solid #a3e4d7; text-align: center; box-shadow: 0 6px 12px rgba(0,0,0,0.08); position: relative; }
    .card-icon { font-size: 4.5rem; display: block; margin-bottom: 10px; }
    .french-text { font-size: 1.8rem; font-weight: 900; color: #2d3748; display: block; margin-bottom: 5px; }
    .english-text { font-size: 1.3rem; color: #5a67d8; font-weight: 800; display: block; min-height: 1.6rem; border-radius: 12px; padding: 5px; margin-bottom: 20px; }
    
    .mystery-active .english-text { background: #edf2f7; color: #edf2f7 !important; border: 2px dashed #cbd5e0; position: relative; }
    .mystery-active .english-text::after { content: "❓ TAP ORANGE"; display: block; color: #5a67d8; font-size: 0.8rem; font-weight: 900; }
    .revealed .english-text { background: transparent !important; color: #06D6A0 !important; border-color: transparent !important; }
    .revealed .english-text::after { display: none !important; }

    .card-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card-btn { border: none; border-radius: 18px; padding: 15px; font-weight: 900; color: white; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
    .spk-fr { background: #4cd964; }
    .spk-en { background: #ff9e6d; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 4px solid #5a67d8; display: flex; z-index: 1000; height: 80px; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; }
    .nav-homework { color: #9d4edd; background: #fdf2ff; }
    .nav-game { color: #ff6b8b; background: #fff5f7; }

    .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 2000; padding: 15px; }
    .overlay-content { background: white; border-radius: 30px; padding: 15px; height: 95vh; overflow-y: auto; text-align: center; }
    
    /* Score Board */
    .scoreboard { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; font-weight: 900; font-size: 1.1rem; }
    .score-win { color: #4cd964; }
    .score-loss { color: #ff4d4d; }

    /* Game Buttons */
    .game-hints { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
    .hint-btn { background: #e0f2fe; color: #0369a1; border: 2px solid #0369a1; padding: 8px 15px; border-radius: 50px; font-weight: 900; font-size: 0.8rem; cursor: pointer; }

    #hangmanCanvas { background: #f8fafc; border-radius: 15px; margin: 5px auto; display: block; border: 2px solid #e2e8f0; max-width: 100%; }
    .clue-emoji { font-size: 3.5rem; display: block; margin: 5px 0; }
    .hangman-word { font-size: 1.8rem; letter-spacing: 4px; margin: 10px 0; font-weight: 900; color: #2d3748; }
    
    .keyboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
    .key { width: 33px; height: 42px; background: #f0f4f8; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; border: 1px solid #cbd5e0; font-size: 0.9rem; }
    .key.used { opacity: 0.2; pointer-events: none; }

    .app-actions { display: flex; gap: 10px; margin-top: 25px; margin-bottom: 20px; }
    .action-btn { flex: 1; padding: 12px; border-radius: 15px; border: none; font-weight: 900; color: white; cursor: pointer; }
    #installBtn { background: #ff6b8b; display: none; }
    #shareBtn { background: #5a67d8; }

    .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .preset-btn { background: white; border: 3px solid #ff9e6d; border-radius: 20px; padding: 15px 5px; font-size: 1rem; font-weight: 900; cursor: pointer; }
    .mystery-btn { width: 100%; padding: 15px; border-radius: 50px; border: 3px solid #5a67d8; background: white; color: #5a67d8; font-weight: 900; margin-bottom: 15px; }
    .mystery-btn.active { background: #5a67d8; color: white; }
   </style>
</head>
<body>

    <div class="container">
        <div class="header"><h1>🇫🇷 French Fun V3.7 🎉</h1></div>

        <div class="status-bar">
            <div class="status-info"><span>🌐</span> <span id="stCountText">Ready!</span></div>
            <button class="magic-mini-btn" id="magicBtn" onclick="magicSync()">✨ Magic</button>
        </div>

        <button id="mysteryToggle" class="mystery-btn" onclick="toggleMysteryMode()">Mystery Mode: OFF</button>

        <div class="preset-grid">
            <button class="preset-btn" onclick="loadPreset('greetings')">👋 Hello</button>
            <button class="preset-btn" onclick="loadPreset('numbers')">🔢 1-10</button>
            <button class="preset-btn" onclick="loadPreset('colors')">🎨 Colors</button>
            <button class="preset-btn" onclick="loadPreset('family')">👨‍👩‍👧 Family</button>
            <button class="preset-btn" onclick="loadPreset('body')">👃 Body</button>
            <button class="preset-btn" onclick="loadPreset('animals')">🐶 Animals</button>
            <button class="preset-btn" onclick="loadPreset('food')">🍎 Food</button>
            <button class="preset-btn" onclick="loadPreset('school')">🏫 School</button>
        </div>

        <div id="phrasesList"></div>

        <div class="app-actions">
            <button id="installBtn" class="action-btn">📱 Install</button>
            <button id="shareBtn" class="action-btn" onclick="shareApp()">🎁 Share</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item nav-homework" onclick="openOverlay('hwDrawer')"><span>📝</span> Homework</div>
        <div class="nav-item nav-game" onclick="openOverlay('gameDrawer')"><span>🎮</span> Game</div>
    </div>

    <!-- Homework Drawer -->
    <div id="hwDrawer" class="overlay">
        <div class="overlay-content">
            <h2 style="color:#9d4edd">✏️ My Homework</h2>
            <textarea id="hwInput" placeholder="Enter words here..."></textarea>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px">
                <button onclick="saveHW()" style="background:#4cd964; color:white; border:none; border-radius:12px; font-weight:900; padding:12px">Save</button>
                <button onclick="openBP()" style="background:#9d4edd; color:white; border:none; border-radius:12px; font-weight:900; padding:12px">Pack</button>
                <button onclick="clearHW()" style="background:#ff4d4d; color:white; border:none; border-radius:12px; font-weight:900; padding:12px">Clear</button>
            </div>
            <button onclick="closeOverlay('hwDrawer')" style="margin-top:20px; background:#2d3748; color:white; padding:15px; width:100%; border-radius:20px; border:none; font-weight:900">Close</button>
        </div>
    </div>

    <!-- Game Drawer -->
    <div id="gameDrawer" class="overlay">
        <div class="overlay-content">
            <div class="scoreboard">
                <span class="score-win">Wins: <span id="winCount">0</span></span>
                <span class="score-loss">Losses: <span id="lossCount">0</span></span>
            </div>

            <h3 id="missionTitle" style="color:#5a67d8; margin-bottom:5px; font-size:1rem;">Mission!</h3>
            
            <div class="game-hints">
                <button class="hint-btn" onclick="spk(targetWord, 'fr-FR')">📢 Listen</button>
                <button class="hint-btn" onclick="spellWord()">🔤 Spell</button>
            </div>

            <div id="clueEmoji" class="clue-emoji">💡</div>
            <canvas id="hangmanCanvas" width="200" height="160"></canvas>
            <div id="hangmanDisplay" class="hangman-word">_ _ _ _</div>
            <div id="gameMsg" style="font-weight:900; margin-bottom:10px; font-size:1.1rem;">Guess!</div>
            <div id="keyboard" class="keyboard"></div>
            
            <button onclick="startHangman()" style="margin-top:20px; background:#4cd964; color:white; padding:15px; width:100%; border-radius:20px; border:none; font-weight:900">Next Word</button>
            <button onclick="exitGame()" style="margin-top:10px; background:#2d3748; color:white; padding:12px; width:100%; border-radius:20px; border:none; font-weight:900">Exit</button>
        </div>
    </div>

    <div id="bpModal" class="overlay" style="z-index:3000">
        <div class="overlay-content">
            <h2 style="color:#9d4edd; margin-bottom:15px">🎒 Backpack</h2>
            <div id="bpList"></div>
            <button onclick="nukeStorage()" style="background:#ff4d4d; color:white; padding:10px; border:none; border-radius:10px; width:100%; margin-top:20px; font-weight:900">⚠️ RESET APP</button>
            <button onclick="closeOverlay('bpModal')" style="margin-top:10px; background:#2d3748; color:white; padding:15px; width:100%; border-radius:20px; border:none; font-weight:bold">Back</button>
        </div>
    </div>

    <script>
        // DATA & EMOJIS
        const emojiMap = {
            "un":"1️⃣","deux":"2️⃣","trois":"3️⃣","quatre":"4️⃣","cinq":"5️⃣","six":"6️⃣","sept":"7️⃣","huit":"8️⃣","neuf":"9️⃣","dix":"🔟",
            "rouge":"🔴","bleu":"🔵","vert":"🟢","jaune":"🟡","orange":"🟠","rose":"🌸","noir":"⚫","blanc":"⚪",
            "chat":"🐱","chien":"🐶","lapin":"🐰","oiseau":"🐦","poisson":"🐟","vache":"🐮","cheval":"🐎",
            "maman":"👩","papa":"👨","soeur":"👧","frere":"👦","bebe":"👶","grand-mere":"👵","grand-père":"👴",
            "pomme":"🍎","pain":"🥖","lait":"🥛","pizza":"🍕","banane":"🍌","fromage":"🧀","gateau":"🍰",
            "tete":"🙆","nez":"👃","bouche":"👄","yeux":"👀","main":"✋","pied":"🦶","crayon":"✏️","livre":"📖","ecole":"🏫"
        };

        const presets = {
            greetings:["Bonjour","Salut","Merci","Au revoir"],
            numbers:["Un","Deux","Trois","Quatre","Cinq","Six","Sept","Huit","Neuf","Dix"],
            colors:["Rouge","Bleu","Vert","Jaune","Orange","Rose","Noir"],
            family:["Maman","Papa","Ma sœur","Mon frère"],
            body:["La tête","Le nez","La bouche","Les yeux","Les mains","Les pieds"],
            animals:["Un chat","Un chien","Un lapin","Un oiseau","Un poisson"],
            food:["Une pomme","Du pain","Du lait","Une pizza","Une banane"],
            school:["Un livre","Un crayon","Un sac","L'école"]
        };

        let cache = JSON.parse(localStorage.getItem('phraseTranslations') || '{}');
        let history = JSON.parse(localStorage.getItem('frenchHistory') || '{}');
        let wins = parseInt(localStorage.getItem('gameWins') || '0');
        let losses = parseInt(localStorage.getItem('gameLosses') || '0');
        
        let isMysteryMode = false;
        let lastWord = "";
        let currentScreenList = [];
        let autoVoiceTimer = null;

        window.onload = () => {
            const raw = localStorage.getItem('homeworkPhrases');
            document.getElementById('hwInput').value = (raw && raw !== "undefined") ? raw : "";
            loadList(raw ? raw.split('\n') : ["Bonjour", "Merci"]);
            updateScoreUI();
            if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
        };

        function norm(t) { return t ? t.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '') : ''; }
        
        function getEmoji(text) {
            const n = norm(text);
            const articles = ['un', 'une', 'le', 'la', 'l', 'du', 'des', 'de'];
            if (emojiMap[n]) return emojiMap[n];
            for (let word of n.split(' ')) {
                if (!articles.includes(word) && emojiMap[word]) return emojiMap[word];
            }
            return "✨"; 
        }

        function loadPreset(k) { loadList(presets[k]); }
        function loadList(list) { currentScreenList = list.filter(l => l.trim().length > 0); renderListUI(); }

        function renderListUI() {
            const container = document.getElementById('phrasesList');
            container.innerHTML = '';
            document.getElementById('stCountText').textContent = `${currentScreenList.length} phrases`;
            currentScreenList.forEach(p => {
                const tr = cache[norm(p)] || null;
                const card = document.createElement('div');
                card.className = 'phrase-card' + (isMysteryMode ? '' : ' revealed');
                const i = document.createElement('span'); i.className = 'card-icon'; i.textContent = getEmoji(p);
                const f = document.createElement('span'); f.className = 'french-text'; f.textContent = p;
                const e = document.createElement('span'); e.className = 'english-text'; e.textContent = tr || '...';
                const bD = document.createElement('div'); bD.className = 'card-btns';
                const sB = document.createElement('button'); sB.className = 'card-btn spk-fr'; sB.textContent = '🎤 French';
                sB.onclick = () => spk(p, 'fr-FR');
                const tB = document.createElement('button'); tB.className = 'card-btn spk-en';
                tB.textContent = isMysteryMode ? '🎯 Reveal' : '🎯 English';
                tB.onclick = () => handleReveal(card, p, e);
                bD.append(sB, tB); card.append(i, f, e, bD); container.appendChild(card);
            });
        }

        async function handleReveal(c, f, d) { c.classList.add('revealed'); let tr = cache[norm(f)]; if (!tr && navigator.onLine) { d.textContent = '⏳...'; tr = await translateOne(f); if (tr) d.textContent = tr; } if (tr) spk(tr, 'en-US'); }
        async function translateOne(p) { try { const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(p)}&langpair=fr|en`); const d = await r.json(); const tr = d.responseData.translatedText; cache[norm(p)] = tr; localStorage.setItem('phraseTranslations', JSON.stringify(cache)); return tr; } catch (e) { return null; } }
        function spk(t, lang) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = lang; u.rate = 0.8; window.speechSynthesis.speak(u); }

        // --- HANGMAN 3.7 ---
        let targetWord, guessed, mistakes, gameActive;
        function startHangman() {
            gameActive = true;
            const hwWords = document.getElementById('hwInput').value.split('\n').map(w => w.trim().toLowerCase()).filter(w => w.length > 1 && !w.includes(' '));
            const pool = hwWords.length > 0 ? hwWords : ["pomme", "chat", "chien", "ecole", "rouge", "un", "maman"];
            let pick; do { pick = pool[Math.floor(Math.random() * pool.length)]; } while (pick === lastWord && pool.length > 1);
            
            lastWord = pick; targetWord = pick.toUpperCase();
            document.getElementById('clueEmoji').textContent = getEmoji(pick);
            guessed = [targetWord[0]]; mistakes = 0;
            
            // Set mission name
            document.getElementById('missionTitle').textContent = hwWords.includes(pick) ? "Homework Mission! ⭐" : "Practice Mission!";
            
            // Auto-voice loop
            if(autoVoiceTimer) clearInterval(autoVoiceTimer);
            autoVoiceTimer = setInterval(() => { if(gameActive) spk(targetWord, 'fr-FR'); }, 8000);
            
            drawHangman(0); updateHangmanUI();
        }

        function spellWord() {
            const letters = targetWord.split('');
            let delay = 0;
            letters.forEach(l => {
                setTimeout(() => { spk(l, 'fr-FR'); }, delay);
                delay += 800;
            });
        }

        function updateHangmanUI() {
            let d = ""; for (let c of targetWord) d += guessed.includes(c) ? c + " " : "_ ";
            document.getElementById('hangmanDisplay').textContent = d;
            
            if (!d.includes("_")) {
                gameActive = false; wins++;
                document.getElementById('gameMsg').textContent = "🏆 EXCELLENT!"; 
                spk("Bravo! Tu as gagné!", 'fr-FR');
                updateScoreUI();
            } else if (mistakes >= 10) {
                gameActive = false; losses++;
                document.getElementById('gameMsg').textContent = "❌ " + targetWord; 
                spk("Oh non! Tu as perdu.", 'fr-FR');
                updateScoreUI();
            } else {
                document.getElementById('gameMsg').textContent = "Guess a letter!";
            }
            renderKeyboard();
        }

        function renderKeyboard() {
            const kb = document.getElementById('keyboard'); kb.innerHTML = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
                const k = document.createElement('div'); k.className = 'key' + (guessed.includes(l) ? ' used' : '');
                k.textContent = l; k.onclick = () => {
                    if (!gameActive) return;
                    guessed.push(l);
                    if (targetWord.includes(l)) {
                        spk("Oui!", 'fr-FR'); // Approval sound
                    } else {
                        mistakes++; drawHangman(mistakes);
                        spk("Non", 'fr-FR'); // Error sound
                    }
                    updateHangmanUI();
                };
                kb.appendChild(k);
            });
        }

        function updateScoreUI() {
            document.getElementById('winCount').textContent = wins;
            document.getElementById('lossCount').textContent = losses;
            localStorage.setItem('gameWins', wins);
            localStorage.setItem('gameLosses', losses);
        }

        function exitGame() { gameActive = false; if(autoVoiceTimer) clearInterval(autoVoiceTimer); closeOverlay('gameDrawer'); }
        function drawHangman(s) {
            const c = document.getElementById('hangmanCanvas'); const ctx = c.getContext('2d');
            ctx.clearRect(0, 0, 200, 160); ctx.lineWidth = 4; ctx.strokeStyle = "#475569";
            if (s >= 1) { ctx.beginPath(); ctx.moveTo(20, 140); ctx.lineTo(180, 140); ctx.stroke(); }
            if (s >= 2) { ctx.beginPath(); ctx.moveTo(40, 140); ctx.lineTo(40, 20); ctx.stroke(); }
            if (s >= 3) { ctx.beginPath(); ctx.moveTo(40, 20); ctx.lineTo(120, 20); ctx.stroke(); }
            if (s >= 4) { ctx.beginPath(); ctx.moveTo(120, 20); ctx.lineTo(120, 40); ctx.stroke(); }
            if (s >= 5) { ctx.beginPath(); ctx.arc(120, 55, 12, 0, Math.PI * 2); ctx.stroke(); }
            if (s >= 6) { ctx.beginPath(); ctx.moveTo(120, 67); ctx.lineTo(120, 100); ctx.stroke(); }
            if (s >= 7) { ctx.beginPath(); ctx.moveTo(120, 75); ctx.lineTo(100, 90); ctx.stroke(); }
            if (s >= 8) { ctx.beginPath(); ctx.moveTo(120, 75); ctx.lineTo(140, 90); ctx.stroke(); }
            if (s >= 9) { ctx.beginPath(); ctx.moveTo(120, 100); ctx.lineTo(100, 125); ctx.stroke(); }
            if (s >= 10) { ctx.beginPath(); ctx.moveTo(120, 100); ctx.lineTo(140, 125); ctx.stroke(); }
        }

        function saveHW() { const val = document.getElementById('hwInput').value; localStorage.setItem('homeworkPhrases', val); const name = prompt("Week Name:", "Week " + (Object.keys(history).length + 1)); if (name) { history[name] = val; localStorage.setItem('frenchHistory', JSON.stringify(history)); alert("Saved! 🎒"); } loadList(val.split('\n')); }
        function openBP() {
            const list = document.getElementById('bpList'); list.innerHTML = '';
            Object.keys(history).reverse().forEach(name => {
                const div = document.createElement('div'); div.className = 'history-item';
                const nS = document.createElement('span'); nS.textContent = name;
                const bC = document.createElement('div');
                const lB = document.createElement('button'); lB.className = 'load-btn'; lB.textContent = 'Load'; lB.style.cssText="background:#b5e6ff; border:none; padding:10px; border-radius:10px; font-weight:bold; margin-right:5px; cursor:pointer;";
                lB.onclick = () => loadHist(name);
                const dB = document.createElement('button'); dB.textContent = '🗑️'; dB.style.cssText="background:#fee2e2; border:none; padding:10px; border-radius:10px; cursor:pointer;";
                dB.onclick = () => delHist(name);
                bC.append(lB, dB); div.append(nS, bC); list.appendChild(div);
            });
            openOverlay('bpModal');
        }
        function nukeStorage() { if(confirm("Erase all data?")) { localStorage.clear(); location.reload(); } }
        function loadHist(n) { document.getElementById('hwInput').value = history[n]; localStorage.setItem('homeworkPhrases', history[n]); loadList(history[n].split('\n')); closeOverlay('bpModal'); closeOverlay('hwDrawer'); }
        function delHist(n) { if (confirm("Delete?")) { delete history[n]; localStorage.setItem('frenchHistory', JSON.stringify(history)); openBP(); } }
        function toggleMysteryMode() { isMysteryMode = !isMysteryMode; document.body.classList.toggle('mystery-active', isMysteryMode); document.getElementById('mysteryToggle').textContent = isMysteryMode ? "Mystery Mode: ON" : "Mystery Mode: OFF"; renderListUI(); }
        function clearHW() { document.getElementById('hwInput').value = ""; localStorage.setItem('homeworkPhrases', ""); loadList([]); }
        function openOverlay(id) { document.getElementById(id).style.display = 'block'; if(id==='gameDrawer') startHangman(); }
        function closeOverlay(id) { document.getElementById(id).style.display = 'none'; }
        
        async function magicSync() {
            const btn = document.getElementById('magicBtn');
            const mode = confirm("✨ Magic Sync EVERYTHING for offline play?");
            let list = mode ? [...new Set([...document.getElementById('hwInput').value.split('\n'), ...Object.values(presets).flat()])] : currentScreenList;
            btn.disabled = true;
            for (let i = 0; i < list.length; i++) {
                btn.textContent = `${i+1}/${list.length}`;
                if (!cache[norm(list[i])]) await translateOne(list[i]);
            }
            btn.textContent = "✨ Magic"; btn.disabled = false; renderListUI();
        }

        // PWA INSTALL LOGIC
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('installBtn').style.display = 'block'; });
        document.getElementById('installBtn').onclick = async () => { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; } };
        function shareApp() { if (navigator.share) { navigator.share({ title: 'French Fun', url: window.location.href }); } else { alert(window.location.href); } }
    </script>
</body>
</html>
