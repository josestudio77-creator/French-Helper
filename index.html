<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇫🇷 French Fun Helper 🎉</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#FF6B8B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="French Fun">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
   <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Nunito', 'Comic Sans MS', sans-serif;
    }

    body {
        background: linear-gradient(to bottom right, #ffccd5, #b5e6ff);
        padding: 10px;
        min-height: 100vh;
        text-align: center;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 5px;
    }

    /* --- Header --- */
    .header {
        background-color: white;
        border-radius: 20px;
        padding: 15px 10px;
        margin-bottom: 15px;
        border: 5px solid #ff9e6d;
        box-shadow: 0 4px 8px rgba(255, 158, 109, 0.3);
    }
    h1 {
        color: #ff6b8b;
        font-size: 1.8rem;
        margin-bottom: 5px;
    }

    /* --- Status Bar --- */
    .status-bar {
        background: white;
        padding: 8px;
        border-radius: 12px;
        margin-bottom: 15px;
        font-weight: bold;
        font-size: 0.9rem;
        display: flex;
        justify-content: center;
        gap: 10px;
    }
    .status-bar.offline { background: #fee2e2; color: #ef4444; }

    /* --- INPUT AREA --- */
    textarea {
        width: 100%;
        min-height: 120px;
        font-size: 1.1rem;
        padding: 15px;
        border-radius: 15px;
        border: 3px solid #ff9e6d;
        background: #fff9e6;
        margin-bottom: 10px;
    }

    /* --- BUTTONS --- */
    .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 15px;
    }
    button {
        border: none;
        border-radius: 15px;
        font-weight: 900;
        cursor: pointer;
        transition: transform 0.1s, filter 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }
    button:active { transform: scale(0.95); }

    .save-btn { background: #4cd964; color: white; padding: 15px; }
    .backpack-btn { background: #9d4edd; color: white; padding: 15px; }
    .clear-btn { background: #ff4d4d; color: white; padding: 10px; font-size: 0.8rem; }
    .export-btn { background: #60a5fa; color: white; padding: 10px; font-size: 0.8rem; }
    
    .bulk-save-btn {
        grid-column: span 2;
        background: linear-gradient(135deg, #118AB2 0%, #0A6F8C 100%);
        color: white;
        padding: 18px;
        font-size: 1.3rem;
        border: 4px solid #0A6F8C;
    }

    /* --- MYSTERY MODE --- */
    .mode-toggle-container {
        margin: 20px 0;
    }
    .game-button {
        padding: 15px 25px;
        border-radius: 50px;
        border: 4px solid #5a67d8;
        background: white;
        font-size: 1.1rem;
        box-shadow: 0 4px 0 #5a67d8;
    }
    .game-button.active {
        background: #5a67d8;
        color: white;
        transform: translateY(3px);
        box-shadow: 0 1px 0 #5a67d8;
    }

    /* --- PHRASE CARDS --- */
    #phrasesList { min-height: 300px; }
    .phrase-card {
        background: white;
        border-radius: 20px;
        padding: 20px 15px;
        margin: 15px 0;
        border: 4px solid #a3e4d7;
        box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        position: relative;
    }
    .french-text { font-size: 1.8rem; font-weight: 900; color: #2d3748; margin-bottom: 10px; }
    .english-text { font-size: 1.2rem; color: #4a5568; font-weight: 700; margin-bottom: 15px; }

    .mystery-active .english-text {
        background: #edf2f7; color: #edf2f7 !important; border-radius: 10px;
    }
    .mystery-active .english-text::after {
        content: "❓ Tap Orange to Reveal";
        position: absolute; left: 0; right: 0; color: #5a67d8; font-size: 1rem;
    }
    .mystery-active .revealed .english-text { background: transparent; color: #06D6A0 !important; }
    .mystery-active .revealed .english-text::after { display: none; }

    .speak-btn { width: 100%; padding: 15px; background: #4cd964; color: white; margin-bottom: 8px; font-size: 1.2rem; }
    .translate-btn { width: 100%; padding: 15px; background: #ff9e6d; color: white; font-size: 1.2rem; }

    /* --- BACKPACK MODAL --- */
    #backpackModal {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7);
        z-index: 1000;
        padding: 20px;
    }
    .modal-content {
        background: white;
        border-radius: 25px;
        padding: 20px;
        max-height: 80vh;
        overflow-y: auto;
    }
    .history-item {
        padding: 15px;
        border-bottom: 2px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-align: left;
    }
    .load-history-btn { background: #b5e6ff; padding: 10px; border-radius: 10px; }

    /* --- PRESETS --- */
    .phrase-sets {
        background: white;
        border-radius: 20px;
        padding: 10px;
        margin-bottom: 15px;
    }
    .preset-buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        margin-top: 10px;
    }
    .preset-btn { font-size: 0.7rem; padding: 10px 5px; background: #f0f0f0; }

    .voice-warning { font-size: 0.8rem; color: #856404; background: #fff3cd; padding: 5px; border-radius: 8px; margin-top: 5px; }

    .bottom-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 20px;
    }
    .bottom-btn { padding: 15px; background: #5a67d8; color: white; text-decoration: none; border-radius: 15px; font-weight: bold; }
</style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🇫🇷🌈 French Fun Helper 🎉</h1>
            <p>Type your phrases of the week below!</p>
        </div>

        <div id="statusBar" class="status-bar">
            <span id="statusIcon">🌐</span> <span id="statusText">Ready!</span>
        </div>

        <div class="phrase-sets">
            <p>✨ Quick Fun Sets:</p>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="loadPreset('greetings')">👋 Hello</button>
                <button class="preset-btn" onclick="loadPreset('numbers')">🔢 1-10</button>
                <button class="preset-btn" onclick="loadPreset('colors')">🎨 Colors</button>
                <button class="preset-btn" onclick="loadPreset('animals')">🐶 Pets</button>
                <button class="preset-btn" onclick="loadPreset('food')">🍎 Food</button>
                <button class="preset-btn" onclick="loadPreset('weather')">☀️ Sky</button>
            </div>
        </div>

        <textarea id="phrasesInput" placeholder="Enter phrases here (one per line)..."></textarea>
        
        <div class="button-row">
            <button class="save-btn" onclick="savePhrases()">💾 Save Now</button>
            <button class="backpack-btn" onclick="toggleBackpack()">🎒 Backpack</button>
            <button class="clear-btn" onclick="clearPhrases()">🧹 Clear</button>
            <button class="export-btn" onclick="exportToFile()">📥 Download Backup</button>
            <button class="bulk-save-btn" onclick="translateAllPhrases()" id="translateAllBtn">
                🌐✨ MAGIC TRANSLATE!
            </button>
        </div>

        <div class="mode-toggle-container">
            <button id="mysteryToggle" class="game-button" onclick="toggleMysteryMode()">
                🕵️‍♀️ Mystery Mode: OFF
            </button>
        </div>

        <div id="phrasesList"></div>

        <div class="bottom-buttons">
            <button id="installButton" class="bottom-btn" style="display:none">📱 Install App</button>
            <button id="shareButton" class="bottom-btn" onclick="shareApp()">🎁 Share App</button>
        </div>
    </div>

    <!-- Backpack Modal -->
    <div id="backpackModal">
        <div class="modal-content">
            <h2 style="margin-bottom:15px">🎒 My Past Weeks</h2>
            <div id="historyList"></div>
            <button onclick="toggleBackpack()" style="margin-top:20px; background:#ff4d4d; color:white; padding:15px; width:100%">Close</button>
        </div>
    </div>

    <script>
        const inp = document.getElementById('phrasesInput');
        const lst = document.getElementById('phrasesList');
        const sb = document.getElementById('statusBar');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');

        let cache = JSON.parse(localStorage.getItem('phraseTranslations') || '{}');
        let history = JSON.parse(localStorage.getItem('frenchHistory') || '{}');
        let isMysteryMode = false;
        let sp = null;

        const dict = {
            "bonjour": "Hello", "bonjour, comment ca va ?": "Hello, how are you?", "ca va bien, merci": "I'm fine, thank you",
            "merci": "Thank you", "au revoir": "Goodbye", "un": "one", "deux": "two", "trois": "three",
            "rouge": "red", "bleu": "blue", "vert": "green", "jaune": "yellow", "chat": "cat", "chien": "dog"
            // More can be added here
        };

        const sets = {
            greetings: ["Bonjour", "Comment ça va ?", "Ça va bien", "Au revoir", "Merci"],
            numbers: ["Un", "Deux", "Trois", "Quatre", "Cinq", "Six", "Sept", "Huit", "Neuf", "Dix"],
            colors: ["Rouge", "Bleu", "Vert", "Jaune", "Noir", "Blanc", "Rose"],
            animals: ["Un chat", "Un chien", "Un oiseau", "Un lapin", "Un lion"],
            food: ["Une pomme", "Une banane", "Du pain", "Du fromage", "Une pizza"],
            weather: ["Il fait beau", "Il pleut", "Il neige", "Il fait froid"]
        };

        function norm(t) {
            return t.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function getTr(t) {
            const n = norm(t);
            if (dict[n]) return dict[n];
            return cache[n] || null;
        }

        function savePhrases() {
            const t = inp.value.trim();
            if (!t) return alert("Write something first! ✍️");
            
            const name = prompt("Name this week (e.g. Week 1, Animals, etc):", "Week " + (Object.keys(history).length + 1));
            if (name) {
                history[name] = t;
                localStorage.setItem('frenchHistory', JSON.stringify(history));
                localStorage.setItem('frenchPhrases', t);
                updList();
                alert("Saved to Backpack! 🎒🏆");
            }
        }

        function toggleBackpack() {
            const modal = document.getElementById('backpackModal');
            const hList = document.getElementById('historyList');
            hList.innerHTML = '';
            
            Object.keys(history).reverse().forEach(name => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <span><b>${name}</b></span>
                    <div>
                        <button class="load-history-btn" onclick="loadHistory('${name}')">📖 Load</button>
                        <button style="background:#ff4d4d; color:white; padding:5px;" onclick="deleteHistory('${name}')">🗑️</button>
                    </div>
                `;
                hList.appendChild(div);
            });
            
            if (Object.keys(history).length === 0) hList.innerHTML = "<p>Your backpack is empty!</p>";
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function loadHistory(name) {
            if (confirm("Replace current list with " + name + "?")) {
                inp.value = history[name];
                toggleBackpack();
                updList();
            }
        }

        function deleteHistory(name) {
            if (confirm("Delete " + name + " forever?")) {
                delete history[name];
                localStorage.setItem('frenchHistory', JSON.stringify(history));
                toggleBackpack();
            }
        }

        function exportToFile() {
            const data = {
                current: inp.value,
                history: history,
                translations: cache
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type : 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'French_Fun_Backup.json';
            a.click();
        }

        async function fetchTr(t) {
            try {
                const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=fr|en`);
                const d = await r.json();
                return d.responseData.translatedText;
            } catch (e) { return null; }
        }

        async function translateAllPhrases() {
            if (!navigator.onLine) return alert("Connect to the internet first! 🌐");
            const phrases = inp.value.split('\n').filter(l => l.trim().length > 0);
            const btn = document.getElementById('translateAllBtn');
            btn.innerHTML = "⏳ Thinking...";
            btn.disabled = true;

            for (let p of phrases) {
                if (!getTr(p)) {
                    const tr = await fetchTr(p);
                    if (tr) {
                        cache[norm(p)] = tr;
                        localStorage.setItem('phraseTranslations', JSON.stringify(cache));
                    }
                }
            }
            btn.innerHTML = "🌐✨ MAGIC TRANSLATE!";
            btn.disabled = false;
            updList();
        }

        function updList() {
            const ps = inp.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            lst.innerHTML = '';
            
            ps.forEach((p, i) => {
                const tr = getTr(p);
                const card = document.createElement('div');
                card.className = 'phrase-card' + (isMysteryMode ? '' : ' revealed');
                card.innerHTML = `
                    <div class="french-text">${p}</div>
                    <div class="english-text">${tr || 'Tap Orange to translate'}</div>
                    <button class="speak-btn" onclick="spkFr(this, '${p.replace(/'/g, "\\'")}')">🎤 Speak French</button>
                    <button class="translate-btn" onclick="revealAndSpeakEn(this, '${p.replace(/'/g, "\\'")}')">🎯 Reveal & English</button>
                `;
                lst.appendChild(card);
            });
        }

        function spkFr(btn, t) {
            if (sp) window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'fr-FR';
            const voices = window.speechSynthesis.getVoices();
            const fv = voices.find(v => v.lang.startsWith('fr'));
            if (fv) u.voice = fv;
            else if (!btn.parentNode.querySelector('.voice-warning')) {
                const w = document.createElement('div');
                w.className = 'voice-warning';
                w.innerText = "💡 Tip: Install French voice in settings!";
                btn.parentNode.appendChild(w);
            }
            window.speechSynthesis.speak(u);
        }

        async function revealAndSpeakEn(btn, fText) {
            const card = btn.parentNode;
            card.classList.add('revealed');
            let tr = getTr(fText);
            
            if (!tr && navigator.onLine) {
                btn.innerText = "⏳...";
                tr = await fetchTr(fText);
                if (tr) {
                    cache[norm(fText)] = tr;
                    localStorage.setItem('phraseTranslations', JSON.stringify(cache));
                    card.querySelector('.english-text').innerText = tr;
                }
                btn.innerText = "🎯 Reveal & English";
            }

            if (tr) {
                if (sp) window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(tr);
                u.lang = 'en-US';
                window.speechSynthesis.speak(u);
            }
        }

        function toggleMysteryMode() {
            isMysteryMode = !isMysteryMode;
            document.body.classList.toggle('mystery-active', isMysteryMode);
            const btn = document.getElementById('mysteryToggle');
            btn.innerText = isMysteryMode ? "🕵️‍♂️ Mystery Mode: ON!" : "🕵️‍♀️ Mystery Mode: OFF";
            btn.classList.toggle('active', isMysteryMode);
            updList();
        }

        function loadPreset(key) {
            inp.value = sets[key].join('\n');
            updList();
        }

        function clearPhrases() {
            if (confirm("Clear current list? (Your Backpack is safe!)")) {
                inp.value = '';
                updList();
            }
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({ title: 'French Fun Helper', url: window.location.href });
            } else {
                alert("Copy this link: " + window.location.href);
            }
        }

        // Initialize
        window.onload = () => {
            const saved = localStorage.getItem('frenchPhrases');
            if (saved) inp.value = saved;
            updList();
            
            window.addEventListener('online', () => {
                sb.classList.remove('offline');
                statusText.innerText = "Online!";
            });
            window.addEventListener('offline', () => {
                sb.classList.add('offline');
                statusText.innerText = "Offline Mode";
            });
        };
    </script>
</body>
</html>
