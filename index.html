<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇫🇷 French Fun V2.8 🎉</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#FF6B8B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
   <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
    body { background: linear-gradient(to bottom right, #ffccd5, #b5e6ff); padding: 10px; padding-bottom: 90px; min-height: 100vh; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; }

    .header { background: white; border-radius: 20px; padding: 12px; margin-bottom: 10px; border: 4px solid #ff9e6d; }
    h1 { color: #ff6b8b; font-size: 1.5rem; }

    .status-bar { background: white; padding: 8px 15px; border-radius: 50px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 3px solid #118AB2; }
    .status-info { font-weight: 800; font-size: 0.85rem; color: #2d3748; }
    .magic-mini-btn { background: #118AB2; color: white; border: none; padding: 8px 15px; border-radius: 50px; font-weight: 900; cursor: pointer; }

    .phrase-card { background: white; border-radius: 20px; padding: 25px 20px; margin: 15px 0; border: 4px solid #a3e4d7; text-align: center; }
    .french-text { font-size: 1.8rem; font-weight: 900; color: #2d3748; display: block; margin-bottom: 10px; }
    .english-text { font-size: 1.3rem; color: #4a5568; font-weight: 700; display: block; min-height: 1.6rem; border-radius: 12px; padding: 8px; margin-bottom: 15px; }
    
    .mystery-active .english-text { background: #edf2f7; color: #edf2f7 !important; border: 2px dashed #cbd5e0; position: relative; }
    .mystery-active .english-text::after { content: "❓ TAP ORANGE"; display: block; color: #5a67d8; font-size: 0.8rem; font-weight: 900; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; }
    .revealed .english-text { background: transparent !important; color: #06D6A0 !important; border-color: transparent !important; }
    .revealed .english-text::after { display: none !important; }

    .card-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card-btn { border: none; border-radius: 15px; padding: 15px; font-weight: 800; color: white; cursor: pointer; font-size: 1rem; }
    .spk-fr { background: #4cd964; }
    .spk-en { background: #ff9e6d; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 4px solid #5a67d8; display: flex; z-index: 1000; height: 75px; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; }
    .nav-homework { color: #9d4edd; background: #fdf2ff; }
    .nav-game { color: #ff6b8b; background: #fff5f7; }

    .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 2000; padding: 15px; }
    .overlay-content { background: white; border-radius: 30px; padding: 20px; height: 90vh; overflow-y: auto; }
    
    textarea { width: 100%; height: 250px; font-size: 1.3rem; padding: 15px; border-radius: 20px; border: 4px solid #9d4edd; margin: 10px 0; outline: none; }
    
    #hangmanCanvas { background: #f8fafc; border-radius: 15px; margin: 5px auto; display: block; border: 2px solid #e2e8f0; }
    .clue-emoji { font-size: 4rem; display: block; margin: 5px 0; }
    .hangman-word { font-size: 2rem; letter-spacing: 5px; margin: 10px 0; font-weight: 900; }
    .key { width: 34px; height: 42px; background: #f0f4f8; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; border: 1px solid #cbd5e0; font-size: 0.9rem; }
    .key.used { opacity: 0.2; }

    .history-item { padding: 15px; border-bottom: 2px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #f9fafb; border-radius: 15px; margin-bottom: 10px; }
    .history-item span { color: #1a202c !important; font-weight: 900; font-size: 1.1rem; }
    
    .mystery-btn { width: 100%; padding: 15px; border-radius: 50px; border: 3px solid #5a67d8; background: white; color: #5a67d8; font-weight: 900; margin-bottom: 15px; }
    .mystery-btn.active { background: #5a67d8; color: white; }
    .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .preset-btn { background: white; border: 3px solid #ff9e6d; border-radius: 20px; padding: 15px 5px; font-size: 0.9rem; font-weight: 900; cursor: pointer; }
   </style>
</head>
<body>

    <div class="container">
        <div class="header"><h1>🇫🇷 French Fun V2.8 🎉</h1></div>

        <div class="status-bar">
            <div class="status-info"><span>🌐</span> <span id="stCountText">Ready!</span></div>
            <button class="magic-mini-btn" id="magicBtn" onclick="magicSync()">✨ Magic</button>
        </div>

        <button id="mysteryToggle" class="mystery-btn" onclick="toggleMysteryMode()">Mystery Mode: OFF</button>

        <div class="preset-grid">
            <button class="preset-btn" onclick="loadPreset('greetings')">👋 Hello</button>
            <button class="preset-btn" onclick="loadPreset('numbers')">🔢 1-10</button>
            <button class="preset-btn" onclick="loadPreset('colors')">🎨 Colors</button>
            <button class="preset-btn" onclick="loadPreset('family')">👨‍👩‍👧 Family</button>
            <button class="preset-btn" onclick="loadPreset('body')">👃 Body</button>
            <button class="preset-btn" onclick="loadPreset('animals')">🐶 Animals</button>
            <button class="preset-btn" onclick="loadPreset('food')">🍎 Food</button>
            <button class="preset-btn" onclick="loadPreset('school')">🏫 School</button>
        </div>

        <div id="phrasesList"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item nav-homework" onclick="openOverlay('hwDrawer')"><span>📝</span> Homework</div>
        <div class="nav-item nav-game" onclick="openOverlay('gameDrawer')"><span>🎮</span> Game</div>
    </div>

    <!-- Homework Drawer -->
    <div id="hwDrawer" class="overlay">
        <div class="overlay-content">
            <h2 style="color:#9d4edd">✏️ My Homework</h2>
            <textarea id="hwInput" placeholder="Enter words here..."></textarea>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px">
                <button onclick="saveHW()" style="background:#4cd964; color:white; border:none; border-radius:12px; font-weight:900; padding:12px">Save</button>
                <button onclick="openBP()" style="background:#9d4edd; color:white; border:none; border-radius:12px; font-weight:900; padding:12px">Pack</button>
                <button onclick="clearHW()" style="background:#ff4d4d; color:white; border:none; border-radius:12px; font-weight:900; padding:12px">Clear</button>
            </div>
            <button onclick="closeOverlay('hwDrawer')" style="margin-top:20px; background:#2d3748; color:white; padding:15px; width:100%; border-radius:20px; border:none; font-weight:900">Close</button>
        </div>
    </div>

    <!-- Game Drawer -->
    <div id="gameDrawer" class="overlay">
        <div class="overlay-content">
            <div id="clueEmoji" class="clue-emoji">💡</div>
            <canvas id="hangmanCanvas" width="200" height="180"></canvas>
            <div id="hangmanDisplay" class="hangman-word">_ _ _ _</div>
            <div id="gameMsg" style="font-weight:900; margin-bottom:10px; min-height:1.5rem;">Guess a letter!</div>
            <div id="keyboard" style="display:flex; flex-wrap:wrap; justify-content:center; gap:5px"></div>
            <button onclick="startHangman()" style="margin-top:20px; background:#4cd964; color:white; padding:15px; width:100%; border-radius:20px; border:none; font-weight:900">Next Word</button>
            <button onclick="closeOverlay('gameDrawer')" style="margin-top:10px; background:#2d3748; color:white; padding:12px; width:100%; border-radius:20px; border:none; font-weight:900">Exit</button>
        </div>
    </div>

    <div id="bpModal" class="overlay" style="z-index:3000">
        <div class="overlay-content">
            <h2 style="color:#9d4edd; margin-bottom:15px">🎒 Saved Weeks</h2>
            <div id="bpList"></div>
            <button onclick="closeOverlay('bpModal')" style="margin-top:20px; background:#2d3748; color:white; padding:15px; width:100%; border-radius:20px; border:none; font-weight:bold">Back</button>
        </div>
    </div>

    <script>
        // HARDCODED DICTIONARY
        const dict = {
            "un": "one", "deux": "two", "trois": "three", "quatre": "four", "cinq": "five",
            "six": "six", "sept": "seven", "huit": "eight", "neuf": "nine", "dix": "ten",
            "pomme": "apple", "chat": "cat", "chien": "dog", "soleil": "sun", "ecole": "school", 
            "maison": "house", "livre": "book", "rouge": "red", "bleu": "blue", "vert": "green", 
            "jaune": "yellow", "bonjour": "hello", "merci": "thank you", "papa": "father", "maman": "mother"
        };

        const emojiMap = {
            "apple": "🍎", "pomme": "🍎", "banana": "🍌", "banane": "🍌", "cat": "🐱", "chat": "🐱", "dog": "🐶", "chien": "🐶", 
            "sun": "☀️", "soleil": "☀️", "house": "🏠", "maison": "🏠", "school": "🏫", "ecole": "🏫",
            "boy": "👦", "garcon": "👦", "girl": "👧", "fille": "👧", "book": "📖", "livre": "📖", "car": "🚗", "voiture": "🚗",
            "red": "🔴", "rouge": "🔴", "blue": "🔵", "bleu": "🔵", "green": "🟢", "vert": "🟢", "yellow": "🟡", "jaune": "🟡",
            "one": "1️⃣", "un": "1️⃣", "two": "2️⃣", "deux": "2️⃣", "three": "3️⃣", "trois": "3️⃣", "hello": "👋", "bonjour": "👋", 
            "bread": "🥖", "pain": "🥖", "water": "💧", "eau": "💧", "milk": "🥛", "lait": "🥛", "fish": "🐟", "poisson": "🐟",
            "bird": "🐦", "oiseau": "🐦", "horse": "🐎", "cheval": "🐎", "cow": "🐮", "vache": "🐮",
            "pizza": "🍕", "cake": "🍰", "gateau": "🍰", "ice": "🍦", "glace": "🍦", "rain": "🌧️", "pluie": "🌧️", 
            "snow": "❄️", "neige": "❄️", "hot": "🔥", "chaud": "🔥", "cold": "🧊", "froid": "🧊", "family": "👨‍👩‍👧", "famille": "👨‍👩‍👧",
            "mother": "👩", "maman": "👩", "father": "👨", "papa": "👨", "sister": "👧", "soeur": "👧", "brother": "👦", "frere": "👦",
            "head": "🙆", "tete": "🙆", "hand": "✋", "main": "✋", "foot": "🦶", "pied": "🦶", "eye": "👁️", "oeil": "👁️", "eyes": "👀", "yeux": "👀",
            "nose": "👃", "nez": "👃", "mouth": "👄", "bouche": "👄", "ear": "👂", "oreille": "👂", "pencil": "✏️", "crayon": "✏️",
            "desk": "🪑", "bureau": "🪑", "bag": "🎒", "sac": "🎒"
        };

        const presets = {
            greetings: ["Bonjour", "Salut", "Merci", "S'il vous plaît", "Au revoir"],
            numbers: ["Un", "Deux", "Trois", "Quatre", "Cinq", "Six", "Sept", "Huit", "Neuf", "Dix"],
            colors: ["Rouge", "Bleu", "Vert", "Jaune", "Orange", "Rose", "Violet", "Marron"],
            family: ["Maman", "Papa", "Ma sœur", "Mon frère", "Ma grand-mère", "Mon grand-père"],
            body: ["La tête", "Le nez", "La bouche", "Les yeux", "Les oreilles", "Les mains", "Les pieds"],
            animals: ["Un chat", "Un chien", "Un lapin", "Un oiseau", "Un poisson", "Un cheval", "Une vache"],
            food: ["Une pomme", "Du pain", "Du fromage", "Du lait", "Une pizza", "Un gâteau"],
            school: ["Un livre", "Un crayon", "Un sac", "Le bureau", "Le professeur", "L'école"]
        };

        let cache = JSON.parse(localStorage.getItem('phraseTranslations') || '{}');
        let history = JSON.parse(localStorage.getItem('frenchHistory') || '{}');
        let isMysteryMode = false;
        let lastWord = "";
        let currentScreenList = [];

        window.onload = () => {
            cleanOldData();
            const rawHw = localStorage.getItem('homeworkPhrases');
            if (rawHw && rawHw.trim().length > 0) {
                loadList(rawHw.split('\n'));
            } else {
                loadPreset('greetings');
            }
            if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
        };

        function cleanOldData() {
            let data = localStorage.getItem('homeworkPhrases');
            // If data is JSON, wipe it or convert it to avoid the "garbled text" bug
            if (data && (data.startsWith('[') || data.startsWith('{'))) {
                localStorage.removeItem('homeworkPhrases');
                data = "";
            }
            document.getElementById('hwInput').value = data || "";
        }

        function norm(t) { return t ? t.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '') : ''; }

        function openOverlay(id) { document.getElementById(id).style.display = 'block'; if(id==='gameDrawer') startHangman(); }
        function closeOverlay(id) { document.getElementById(id).style.display = 'none'; }
        function loadPreset(k) { loadList(presets[k]); }

        async function magicSync() {
            const btn = document.getElementById('magicBtn');
            const mode = confirm("✨ Magic Sync!\n\nOK: Sync EVERYTHING (All sets + Homework) for offline.\nCancel: Just this screen.");
            let list = mode ? [...new Set([...document.getElementById('hwInput').value.split('\n'), ...Object.values(presets).flat()])] : currentScreenList;
            if (list.length === 0) return;
            btn.disabled = true;
            for (let i = 0; i < list.length; i++) {
                btn.textContent = `${i+1}/${list.length}`;
                if (!cache[norm(list[i])]) await translateOne(list[i]);
            }
            btn.textContent = "✨ Magic"; btn.disabled = false; renderListUI();
        }

        function loadList(list) { currentScreenList = list.filter(l => l.trim().length > 0); renderListUI(); }

        function renderListUI() {
            const container = document.getElementById('phrasesList');
            container.innerHTML = '';
            document.getElementById('stCountText').textContent = `${currentScreenList.length} phrases`;
            currentScreenList.forEach(p => {
                const tr = dict[norm(p)] || cache[norm(p)] || null;
                const card = document.createElement('div');
                card.className = 'phrase-card' + (isMysteryMode ? '' : ' revealed');
                
                const fSpan = document.createElement('span'); fSpan.className = 'french-text'; fSpan.textContent = p;
                const eSpan = document.createElement('span'); eSpan.className = 'english-text'; eSpan.textContent = tr || '...';
                
                const btns = document.createElement('div'); btns.className = 'card-btns';
                const sBtn = document.createElement('button'); sBtn.className = 'card-btn spk-fr'; sBtn.textContent = '🎤 French';
                sBtn.onclick = () => spk(p, 'fr-FR');
                const tBtn = document.createElement('button'); tBtn.className = 'card-btn spk-en';
                tBtn.textContent = isMysteryMode ? '🎯 Reveal' : '🎯 English';
                tBtn.onclick = () => handleReveal(card, p, eSpan);

                btns.append(sBtn, tBtn);
                card.append(fSpan, eSpan, btns);
                container.appendChild(card);
            });
        }

        async function handleReveal(card, french, display) {
            card.classList.add('revealed');
            let tr = dict[norm(french)] || cache[norm(french)];
            if (!tr && navigator.onLine) {
                display.textContent = '⏳...';
                tr = await translateOne(french);
                if (tr) display.textContent = tr;
            }
            if (tr) spk(tr, 'en-US');
        }

        async function translateOne(p) {
            const normalized = norm(p);
            if (dict[normalized]) return dict[normalized];
            try {
                const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(p)}&langpair=fr|en`);
                const d = await r.json(); const tr = d.responseData.translatedText;
                cache[normalized] = tr; localStorage.setItem('phraseTranslations', JSON.stringify(cache));
                return tr;
            } catch (e) { return null; }
        }

        function spk(t, lang) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = lang; u.rate = 0.8; window.speechSynthesis.speak(u); }

        function startHangman() {
            const raw = document.getElementById('hwInput').value.split('\n').filter(w => w.trim().length > 2 && !w.includes(' '));
            const hwWords = raw.length > 0 ? raw : ["POMME", "CHAT", "CHIEN", "ECOLE", "MAISON", "LIVRE", "ROUGE", "VERT", "BLEU"];
            
            let pick; 
            // Anti-stuck logic: ensure we actually try to pick a new word
            if (hwWords.length > 1) {
                do { pick = hwWords[Math.floor(Math.random() * hwWords.length)]; } while (pick === lastWord);
            } else {
                pick = hwWords[0];
            }
            
            lastWord = pick; targetWord = pick.toUpperCase();
            
            const frNorm = norm(pick);
            const english = (dict[frNorm] || cache[frNorm] || "").toLowerCase();
            let emoji = "💡";
            
            if (emojiMap[frNorm]) emoji = emojiMap[frNorm];
            else {
                for (let key in emojiMap) {
                    if (english.includes(key)) { emoji = emojiMap[key]; break; }
                }
            }
            
            document.getElementById('clueEmoji').textContent = emoji;
            guessed = [targetWord[0]]; mistakes = 0;
            drawHangman(0); updateHangmanUI();
        }

        function updateHangmanUI() {
            let d = ""; for (let c of targetWord) d += guessed.includes(c) ? c + " " : "_ ";
            document.getElementById('hangmanDisplay').textContent = d;
            if (!d.includes("_")) { document.getElementById('gameMsg').textContent = "🏆 BRAVO!"; spk("Bravo!", 'en-US'); }
            else if (mistakes >= 10) { document.getElementById('gameMsg').textContent = "❌ " + targetWord; spk("Oh no!", 'en-US'); }
            else { document.getElementById('gameMsg').textContent = "Guess a letter!"; }
            renderKeyboard();
        }

        function renderKeyboard() {
            const kb = document.getElementById('keyboard'); kb.innerHTML = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
                const k = document.createElement('div'); k.className = 'key' + (guessed.includes(l) ? ' used' : '');
                k.textContent = l; k.onclick = () => { if (guessed.includes(l) || mistakes >= 10) return; guessed.push(l); if (!targetWord.includes(l)) { mistakes++; drawHangman(mistakes); } updateHangmanUI(); };
                kb.appendChild(k);
            });
        }

        function drawHangman(step) {
            const canvas = document.getElementById('hangmanCanvas'); const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 200, 180); ctx.lineWidth = 4; ctx.strokeStyle = "#475569";
            if (step >= 1) { ctx.beginPath(); ctx.moveTo(20, 160); ctx.lineTo(180, 160); ctx.stroke(); }
            if (step >= 2) { ctx.beginPath(); ctx.moveTo(40, 160); ctx.lineTo(40, 20); ctx.stroke(); }
            if (step >= 3) { ctx.beginPath(); ctx.moveTo(40, 20); ctx.lineTo(120, 20); ctx.stroke(); }
            if (step >= 4) { ctx.beginPath(); ctx.moveTo(120, 20); ctx.lineTo(120, 40); ctx.stroke(); }
            if (step >= 5) { ctx.beginPath(); ctx.arc(120, 55, 15, 0, Math.PI * 2); ctx.stroke(); }
            if (step >= 6) { ctx.beginPath(); ctx.moveTo(120, 70); ctx.lineTo(120, 110); ctx.stroke(); }
            if (step >= 7) { ctx.beginPath(); ctx.moveTo(120, 80); ctx.lineTo(100, 100); ctx.stroke(); }
            if (step >= 8) { ctx.beginPath(); ctx.moveTo(120, 80); ctx.lineTo(140, 100); ctx.stroke(); }
            if (step >= 9) { ctx.beginPath(); ctx.moveTo(120, 110); ctx.lineTo(100, 140); ctx.stroke(); }
            if (step >= 10) { ctx.beginPath(); ctx.moveTo(120, 110); ctx.lineTo(140, 140); ctx.stroke(); }
        }

        function saveHW() {
            const val = document.getElementById('hwInput').value;
            localStorage.setItem('homeworkPhrases', val);
            const name = prompt("Name this week:", "Week " + (Object.keys(history).length + 1));
            if (name) { history[name] = val; localStorage.setItem('frenchHistory', JSON.stringify(history)); alert("Saved! 🎒"); }
            loadList(val.split('\n'));
        }

        function openBP() {
            const list = document.getElementById('bpList'); list.innerHTML = '';
            Object.keys(history).reverse().forEach(name => {
                const div = document.createElement('div'); div.className = 'history-item';
                const nSpan = document.createElement('span'); nSpan.textContent = name;
                const btns = document.createElement('div');
                const loadBtn = document.createElement('button'); loadBtn.className = 'load-btn'; loadBtn.textContent = 'Load';
                loadBtn.onclick = () => loadHist(name);
                const delBtn = document.createElement('button'); delBtn.className = 'del-btn'; delBtn.textContent = '🗑️';
                delBtn.onclick = () => delHist(name);
                btns.append(loadBtn, delBtn);
                div.append(nSpan, btns);
                list.appendChild(div);
            });
            openOverlay('bpModal');
        }

        function loadHist(n) { document.getElementById('hwInput').value = history[n]; localStorage.setItem('homeworkPhrases', history[n]); loadList(history[n].split('\n')); closeOverlay('bpModal'); }
        function delHist(n) { if (confirm("Delete " + n + "?")) { delete history[n]; localStorage.setItem('frenchHistory', JSON.stringify(history)); openBP(); } }
        function toggleMysteryMode() { isMysteryMode = !isMysteryMode; document.body.classList.toggle('mystery-active', isMysteryMode); document.getElementById('mysteryToggle').textContent = isMysteryMode ? "Mystery Mode: ON" : "Mystery Mode: OFF"; renderListUI(); }
        function clearHW() { document.getElementById('hwInput').value = ""; localStorage.setItem('homeworkPhrases', ""); loadList([]); }
    </script>
</body>
</html>
